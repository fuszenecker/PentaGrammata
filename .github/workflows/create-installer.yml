name: Create Installer

# The only place the installers are built: a pushed version tag (MAJOR.MINOR.PATCH.BUILD, e.g. 2.1.0.0) builds the
# Linux (.deb + .rpm), Windows (.exe) and macOS (.dmg) installers and publishes them on a GitHub release, with the
# release notes of the version (RELEASE_NOTES.md) and the downloads. It can also be started by hand for an existing
# tag, e.g. to rebuild its installers; the release is then refreshed.
#
#   check          -> the tag is the version of version.txt, and RELEASE_NOTES.md has its notes
#   test           -> the tests of the tagged code
#   build-linux    -> .deb (Ubuntu 26.04) + .rpm (Rocky 10), built in Podman containers of those distributions
#   build-windows  -> .exe (NSIS) on a Windows runner
#   build-macos    -> .dmg (Apple Silicon) on a macOS runner
#   release        -> a stable release, always marked latest, with the notes and all the installers
#
# The release job waits for every other job, so a release is only created once the tests passed and every
# installer has built.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag to (re)release, e.g. 2.1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: create-installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The scripts name the installers after version.txt, so the tag must be that version
      - name: Check the version
        id: version
        run: |
          set -eu
          version="$(tr -d '[:space:]' < version.txt)"
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag (${TAG}) is not a MAJOR.MINOR.PATCH.BUILD version."
            exit 1
          fi
          if [ "${version}" != "${TAG}" ]; then
            echo "::error::The tag (${TAG}) is not the version of version.txt (${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract the notes of the version
        run: |
          ./scripts/Release-Notes.sh "${TAG}" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test PentaGrammata.slnx --configuration Release

  build-linux:
    name: Build .deb and .rpm (Podman)
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the .deb and .rpm installers
        run: ./scripts/Build-Installer.Podman.sh --format all --version "${VERSION}"

      - name: Verify the installers
        run: |
          ls -lh installer/deb/pentagrammata_${VERSION}_*.deb
          ls -lh installer/rpm/x86_64/pentagrammata-${VERSION}-*.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            installer/deb/*.deb
            installer/rpm/x86_64/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows .exe (NSIS)
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -VERSION

      # The script publishes win-x64 (self-contained) and runs makensis
      - name: Build the Windows installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version $env:VERSION

      - name: Verify the installer
        shell: bash
        run: ls -lh "installer/nsis/PentaGrammata-${VERSION}-win-x64-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer/nsis/PentaGrammata-*-win-x64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS .dmg
    needs: check
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the macOS installer
        run: ./scripts/Build-Dmg-Installer.sh --runtime osx-arm64 --version "${VERSION}"

      - name: Verify the installer
        run: ls -lh "installer/dmg/PentaGrammata-${VERSION}-osx-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: installer/dmg/PentaGrammata-*-osx-arm64.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: [check, test, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the installers
        run: |
          set -eu
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' \) | sort > installers.txt
          cat installers.txt
          if [ "$(wc -l < installers.txt)" -lt 4 ]; then
            echo "::error::Expected 4 installers (deb, rpm, exe, dmg)."
            exit 1
          fi

      # The notes of the version, then the downloads (with how to install them)
      - name: Compose the release notes
        run: |
          set -eu
          {
            cat artifacts/release-notes/release-notes.md
            echo
            echo "### Downloads"
            echo
            echo "- **Windows** (x64): \`PentaGrammata-${VERSION}-win-x64-setup.exe\`, the installer."
            echo "- **Debian, Ubuntu** (x64): \`sudo apt install ./pentagrammata_${VERSION}_amd64.deb\`"
            echo "- **Fedora, RHEL, Rocky** (x64): \`sudo dnf install ./pentagrammata-${VERSION}-*.x86_64.rpm\`"
            echo "- **macOS** (Apple Silicon): \`PentaGrammata-${VERSION}-osx-arm64.dmg\`. The image is not signed: open the app the first time with right-click → Open (or run \`xattr -dr com.apple.quarantine /Applications/PentaGrammata.app\`)."
            echo
            echo "No .NET is needed: every installer is self-contained."
          } > release-notes-full.md
          cat release-notes-full.md

      # Always a stable release and the latest one; a release of an existing tag gets the new notes and installers
      - name: Create or refresh the release
        run: |
          set -eu
          mapfile -t installers < installers.txt
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "${installers[@]}"
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes-full.md --prerelease=false --draft=false --latest
          else
            gh release create "${TAG}" "${installers[@]}" \
              --title "${TAG}" \
              --notes-file release-notes-full.md \
              --generate-notes \
              --verify-tag \
              --latest
          fi
